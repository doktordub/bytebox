name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff
        run: |
          python -m ruff check src/bytebox/config.py src/bytebox/ingest_security.py src/bytebox/observability/redaction.py src/memory_store/__init__.py scripts/run_coverage_matrix.py tests/test_phase1_config_models.py tests/test_phase9_quality_security.py
          python -m ruff format --check src/bytebox/config.py src/bytebox/ingest_security.py src/bytebox/observability/redaction.py src/memory_store/__init__.py scripts/run_coverage_matrix.py tests/test_phase1_config_models.py tests/test_phase9_quality_security.py

      - name: Mypy
        env:
          PYTHONPATH: src
        run: python -m mypy src/bytebox/config.py src/bytebox/ingest_security.py src/bytebox/observability/redaction.py src/memory_store/__init__.py scripts/run_coverage_matrix.py

      - name: Focused quality tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_phase1_config_models.py tests/test_phase9_quality_security.py

  coverage:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Branch-aware coverage gate
        run: python scripts/run_coverage_matrix.py

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: build/coverage

  windows-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Windows smoke tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m pytest tests/test_phase1_config_models.py tests/test_phase6_ingest_orchestration.py tests/test_phase10_rest_cli.py -k "not rest_app_smoke_flows_against_real_store"

  build:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build release artifacts
        run: python -m build --sdist --wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bytebox-dist
          path: dist